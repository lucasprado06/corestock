{% extends 'base.html' %}

{% block title %}Cadastrar Usuário{% endblock %}

{% block content %}
    <h1>Cadastrar Novo Usuário</h1>
    <form action="{{ url_for('cadastrar_usuario') }}" method="post">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
            <label for="registro">Registro (ID):</label>
            <input type="text" id="registro" name="registro" required>
        </div>
        <div class="form-group">
            <label for="departamento">Departamento:</label>
            <select id="departamento" name="departamento" required>
                <option value="" disabled selected>Selecione um departamento</option>
                {% for dep in departamentos %}
                    <option value="{{ dep }}">{{ dep }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>
        <div class="form-group">
            <label for="permissao">Permissão:</label>
            <select id="permissao" name="permissao">
                <option value="solicitante">Solicitante</option>
                <option value="administrador">Administrador</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Cadastrar Usuário</button>
    </form>

    <style>
        /* Estilos específicos para a página de cadastro */
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
{% endblock %}
