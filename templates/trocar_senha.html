{% extends 'base.html' %}

{% block title %}Trocar Senha{% endblock %}

{% block content %}
    <h1 style="text-align: center; color: #333;">Trocar Senha</h1>
    <div class="form-container">
        <form action="{{ url_for('trocar_senha') }}" method="post">
            <div class="form-group">
                <label for="senha_atual">Senha Atual:</label>
                <input type="password" id="senha_atual" name="senha_atual" required>
            </div>
            <div class="form-group">
                <label for="nova_senha">Nova Senha:</label>
                <input type="password" id="nova_senha" name="nova_senha" required>
            </div>
            <div class="form-group">
                <label for="confirmacao_senha">Confirmar Nova Senha:</label>
                <input type="password" id="confirmacao_senha" name="confirmacao_senha" required>
            </div>
            <button type="submit" class="btn">Trocar Senha</button>
        </form>
    </div>

    <style>
        .form-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 25px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
{% endblock %}
